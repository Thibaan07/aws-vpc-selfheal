name: terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write       # lets the run request a badge from GitHub
  contents: read
  pull-requests: write  # lets it post the plan as a PR comment

env:
  TF_VAR_my_ip: ${{ secrets.MY_IP }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::589458396976:role/github-actions-terraform
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Write public key
        run: |
          mkdir -p ~/.ssh
          echo "${{ vars.TF_PUBLIC_KEY }}" > ~/.ssh/tf-key.pub

      - run: terraform init -input=false
      - run: terraform validate

      - id: plan
        run: terraform plan -input=false -no-color

      - name: Post plan to PR
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const fence = "`".repeat(3);
            const plan = process.env.PLAN.slice(-60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "### Terraform plan\n" + fence + "\n" + plan + "\n" + fence
            });

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::589458396976:role/github-actions-terraform
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Write public key
        run: |
          mkdir -p ~/.ssh
          echo "${{ vars.TF_PUBLIC_KEY }}" > ~/.ssh/tf-key.pub

      - run: terraform init -input=false
      - run: terraform apply -auto-approve -input=false